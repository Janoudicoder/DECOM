<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediScan — Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand: { DEFAULT: '#2563eb', dark: '#1d4ed8' },
        teal:  { DEFAULT: '#0891b2' },
        sidebar: '#0f172a'
      }
    }
  }
}
</script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-slate-800 to-blue-900">

  <div class="bg-white rounded-2xl shadow-2xl p-10 w-full max-w-md mx-4">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-600 to-teal-500 mb-4 shadow-lg">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-gray-800">MediScan</h1>
      <p class="text-gray-500 mt-1 text-sm">Radiology &amp; MRI Center Management</p>
    </div>

    <!-- Form -->
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
        <input id="login-email" type="email" value="demo@mediscan.com"
               class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition"
               placeholder="demo@mediscan.com">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
        <input id="login-pass" type="password" value="demo123"
               class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition"
               placeholder="••••••••">
      </div>

      <a href="dashboard.html"
         class="block w-full text-center bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition mt-2 text-sm">
        Login to Dashboard
      </a>
    </div>

    <!-- Demo credentials -->
    <div class="mt-6 p-4 bg-blue-50 border border-blue-100 rounded-xl">
      <p class="text-xs font-semibold text-blue-600 mb-1">&#9432; Demo Credentials</p>
      <p class="text-xs text-blue-700">Email: demo@mediscan.com</p>
      <p class="text-xs text-blue-700">Password: demo123</p>
    </div>

    <!-- Portal link -->
    <div class="mt-6 text-center">
      <a href="patient-portal.html" class="text-sm text-teal-600 hover:text-teal-700 font-medium hover:underline">
        Patient Portal &#8594;
      </a>
    </div>
  </div>

</body>
</html>
