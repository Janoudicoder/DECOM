<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ميدي سكان — فحص جديد</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{colors:{sidebar:'#0f172a'}}}}</script>
</head>
<body class="flex min-h-screen bg-gray-50" style="font-family: 'Cairo', sans-serif;">

<!-- ===== الشريط الجانبي ===== -->
<aside class="w-60 flex-shrink-0 bg-slate-900 flex flex-col min-h-screen">
  <div class="p-5 border-b border-slate-700">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-600 to-teal-500 flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
      </div>
      <div>
        <p class="text-white font-bold text-base leading-none">ميدي سكان</p>
        <p class="text-slate-400 text-xs mt-0.5">مركز الأشعة</p>
      </div>
    </div>
  </div>
  <nav class="flex-1 py-4 px-3 space-y-0.5">
    <p class="text-xs font-semibold text-slate-500 px-3 mb-2 uppercase tracking-widest">القائمة الرئيسية</p>
    <a href="dashboard.html"       class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white text-sm font-medium transition">&#127968; <span>لوحة التحكم</span></a>
    <a href="patients.html"        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white text-sm font-medium transition">&#128101; <span>المرضى</span></a>
    <a href="appointments.html"    class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white text-sm font-medium transition">&#128197; <span>المواعيد</span></a>
    <a href="new-examination.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-blue-600 text-white text-sm font-medium">&#128302; <span>الفحوصات</span></a>
    <a href="reports.html"         class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white text-sm font-medium transition">&#128203; <span>التقارير</span></a>
    <a href="payments.html"        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white text-sm font-medium transition">&#128179; <span>المدفوعات</span></a>
    <a href="doctors.html"         class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white text-sm font-medium transition">&#128104;&#8205;&#9877;&#65039; <span>الأطباء</span></a>
    <a href="settings.html"        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white text-sm font-medium transition">&#9881;&#65039; <span>الإعدادات</span></a>
  </nav>
  <div class="p-3 border-t border-slate-700 space-y-2">
    <a href="patient-portal.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-teal-900 text-teal-300 hover:bg-teal-800 text-sm font-medium transition">&#128279; <span>بوابة المريض</span></a>
    <div class="flex items-center gap-3 px-2 py-2">
      <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white text-xs font-bold">SM</div>
      <div class="flex-1 min-w-0">
        <p class="text-white text-xs font-semibold leading-none">د. سارة ميلر</p>
        <p class="text-slate-400 text-xs mt-0.5">أخصائية أشعة</p>
      </div>
      <a href="login.html" class="text-slate-500 hover:text-red-400 transition text-xs" title="تسجيل الخروج">&#10132;</a>
    </div>
  </div>
</aside>

<!-- ===== المحتوى الرئيسي ===== -->
<main class="flex-1 overflow-auto p-6">
  <div class="mb-6">
    <h2 class="text-2xl font-bold text-gray-800">فحص جديد</h2>
    <p class="text-gray-500 text-sm mt-1">جدولة وإنشاء فحص جديد</p>
  </div>

  <!-- بانر النجاح (مخفي افتراضياً) -->
  <div id="success-banner" class="hidden mb-5 p-4 bg-green-50 border border-green-200 rounded-xl flex items-center gap-3">
    <span class="text-2xl">&#9989;</span>
    <div>
      <p class="font-semibold text-green-800">تم جدولة الفحص بنجاح!</p>
      <p class="text-sm text-green-600">تم إبلاغ المريض وإضافة الفحص إلى الجدول.</p>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow-sm p-6 max-w-3xl">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <!-- المريض -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1 text-right">المريض *</label>
        <select class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition text-right">
          <option>أحمد الراشد (P-001)</option>
          <option>سارة جونسون (P-002)</option>
          <option>محمد الفارسي (P-003)</option>
          <option>إيميلي تشن (P-004)</option>
          <option>خالد المنصوري (P-005)</option>
          <option>لورا مارتينيز (P-006)</option>
          <option>عمر حسن (P-007)</option>
          <option>فاطمة الزهراء (P-008)</option>
          <option>ديفيد طومسون (P-009)</option>
          <option>نور السعيد (P-010)</option>
        </select>
      </div>

      <!-- نوع الفحص -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2 text-right">نوع الفحص *</label>
        <div class="flex gap-5 flex-wrap pt-1">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="modality" value="MRI" checked class="accent-blue-600 w-4 h-4">
            <span class="text-sm font-medium text-gray-700">رنين مغناطيسي</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="modality" value="CT" class="accent-blue-600 w-4 h-4">
            <span class="text-sm font-medium text-gray-700">أشعة مقطعية</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="modality" value="X-Ray" class="accent-blue-600 w-4 h-4">
            <span class="text-sm font-medium text-gray-700">أشعة سينية</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="modality" value="Ultrasound" class="accent-blue-600 w-4 h-4">
            <span class="text-sm font-medium text-gray-700">موجات صوتية</span>
          </label>
        </div>
      </div>

      <!-- منطقة الجسم -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1 text-right">منطقة الجسم *</label>
        <select class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition text-right">
          <option>الدماغ</option>
          <option>العمود الفقري (عنقي)</option>
          <option>العمود الفقري (قطني)</option>
          <option>الصدر</option>
          <option>البطن</option>
          <option>الحوض</option>
          <option>الركبة</option>
          <option>الكتف</option>
          <option>الورك</option>
          <option>الرسغ</option>
          <option>الكاحل</option>
        </select>
      </div>

      <!-- الطبيب المحول -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1 text-right">الطبيب المحول *</label>
        <select class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition text-right">
          <option>د. سارة ميلر</option>
          <option>د. جيمس ويلسون</option>
          <option>د. عائشة باتيل</option>
          <option>د. روبرت تشن</option>
        </select>
      </div>

      <!-- السعر -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1 text-right">السعر (دولار)</label>
        <input type="number" placeholder="650" value="650"
               class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition text-right">
      </div>

      <!-- حالة الدفع -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1 text-right">حالة الدفع</label>
        <select class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition text-right">
          <option>مدفوع</option>
          <option>جزئي</option>
          <option>قيد الانتظار</option>
        </select>
      </div>

      <!-- التاريخ والوقت -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1 text-right">تاريخ ووقت الموعد *</label>
        <input type="datetime-local" value="2026-08-16T09:00"
               class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition">
      </div>

      <!-- الغرفة -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1 text-right">الغرفة</label>
        <select class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition text-right">
          <option>غرفة 1 — رنين مغناطيسي 3T</option>
          <option>غرفة 2 — رنين مغناطيسي 1.5T</option>
          <option>غرفة 3 — أشعة مقطعية</option>
          <option>غرفة 4 — أشعة سينية</option>
          <option>غرفة 5 — موجات صوتية</option>
        </select>
      </div>

      <!-- ملاحظات -->
      <div class="md:col-span-2">
        <label class="block text-sm font-semibold text-gray-700 mb-1 text-right">الملاحظات السريرية</label>
        <textarea rows="4" placeholder="أدخل الملاحظات السريرية، المؤشر، التاريخ المرضي..."
                  class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition resize-none text-right"></textarea>
      </div>
    </div>

    <div class="flex gap-3 mt-6">
      <button onclick="submitExam()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-8 py-2.5 rounded-lg transition">
        &#128190; إرسال الفحص
      </button>
      <button onclick="clearForm()" class="border border-gray-300 text-gray-600 hover:bg-gray-50 text-sm font-semibold px-6 py-2.5 rounded-lg transition">
        مسح النموذج
      </button>
    </div>
  </div>
</main>

<script>
function submitExam() {
  const banner = document.getElementById('success-banner');
  banner.classList.remove('hidden');
  banner.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  setTimeout(() => banner.classList.add('hidden'), 5000);
}

function clearForm() {
  document.querySelectorAll('input[type="text"], input[type="number"], textarea').forEach(el => el.value = '');
  document.querySelectorAll('select').forEach(el => el.selectedIndex = 0);
  document.querySelector('input[name="modality"][value="MRI"]').checked = true;
}
</script>
</body>
</html>
